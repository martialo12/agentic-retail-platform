services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arp
      POSTGRES_PASSWORD: arp
      POSTGRES_DB: arp
    ports: ["5432:5432"]
    volumes:
      - ./infra/local/init-pgvector.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
