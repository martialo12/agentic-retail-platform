# Cloud Run terminates TLS and forwards the original scheme; a plain local run
# has no such header and keeps nginx's own.
map $http_x_forwarded_proto $arp_public_scheme {
    default $scheme;
    https   https;
    http    http;
}

# The Host header lands in an HTML attribute below, so only a hostname shape
# gets through. nginx already rejects the worst characters, but not quotes or
# angle brackets; a forged Host then yields an empty origin, not markup.
map $host $arp_public_host {
    default          "";
    "~^[a-z0-9.-]+$" $host;
}

# SPA server for the console bundle. Runs under nginx-unprivileged, which owns
# the process as a non-root user and listens on 8080.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The social-preview tags in index.html need absolute URLs, and the origin
    # the console is reached on (run.app hash URL, custom domain…) is only
    # known per request. Substituted on HTML responses only (the default
    # sub_filter_types), so the fingerprinted assets stay untouched.
    sub_filter '__ARP_PUBLIC_ORIGIN__' '$arp_public_scheme://$arp_public_host';
    sub_filter_once off;

    # Fingerprinted assets never change under their hashed name — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Runtime configuration, rewritten at each start. Caching it would pin the
    # console to a stale API URL across a redeploy.
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # History fallback: an unknown path is a client route (/enrichissement,
    # /observabilite), so serve the app shell and let vue-router resolve it.
    # A refresh on a deep link must not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
