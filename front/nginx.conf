# SPA server for the console bundle. Runs under nginx-unprivileged, which owns
# the process as a non-root user and listens on 8080.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted assets never change under their hashed name — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # History fallback: an unknown path is a client route (/enrichissement,
    # /observabilite), so serve the app shell and let vue-router resolve it.
    # A refresh on a deep link must not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
