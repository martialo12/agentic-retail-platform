# GKE deployment of the MCP tool server — the Kubernetes counterpart of the
# Cloud Run service in infra/terraform. Same image, same contract.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arp-mcp
  labels:
    app.kubernetes.io/name: arp-mcp
    app.kubernetes.io/part-of: agentic-retail-platform
  annotations:
    # Workload Identity: bind to the GCP service account Terraform creates, so
    # Vertex AI is reached without a downloaded key file.
    iam.gke.io/gcp-service-account: arp-dev-run@your-gcp-project.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arp-mcp
  labels:
    app.kubernetes.io/name: arp-mcp
    app.kubernetes.io/component: tool-server
    app.kubernetes.io/part-of: agentic-retail-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: arp-mcp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arp-mcp
        app.kubernetes.io/component: tool-server
        app.kubernetes.io/part-of: agentic-retail-platform
    spec:
      serviceAccountName: arp-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          # Replace with the digest-pinned image pushed to Artifact Registry.
          image: europe-west1-docker.pkg.dev/your-gcp-project/arp/arp-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: arp-config
            - secretRef:
                name: arp-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The MCP endpoint only answers POST with a session handshake, so a
          # TCP check is the honest liveness signal here.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Root filesystem is read-only; give the process a writable scratch dir.
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: arp-mcp
  labels:
    app.kubernetes.io/name: arp-mcp
    app.kubernetes.io/part-of: agentic-retail-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arp-mcp
