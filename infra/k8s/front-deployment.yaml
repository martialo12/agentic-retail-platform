# GKE deployment of the console's static bundle — plain nginx serving the built
# SPA. No identity, no ConfigMap, no Secret: it touches nothing but its own
# files, and reaches the API from the browser, not from the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arp-console
  labels:
    app.kubernetes.io/name: arp-console
    app.kubernetes.io/component: console-front
    app.kubernetes.io/part-of: agentic-retail-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: arp-console
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arp-console
        app.kubernetes.io/component: console-front
        app.kubernetes.io/part-of: agentic-retail-platform
    spec:
      securityContext:
        # 101 is the nginx-unprivileged user baked into the image.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          # Replace with the digest-pinned image pushed to Artifact Registry.
          image: europe-west1-docker.pkg.dev/your-gcp-project/arp/arp-console:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # nginx needs these writable even under a read-only root filesystem.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: arp-console
  labels:
    app.kubernetes.io/name: arp-console
    app.kubernetes.io/component: console-front
    app.kubernetes.io/part-of: agentic-retail-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arp-console
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
