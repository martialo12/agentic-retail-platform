# Template only — copy to secret.yaml, fill in, and keep it out of version
# control (.gitignore excludes *.tfvars and .env; do the same for secret.yaml).
# In a real cluster prefer External Secrets or Secret Manager CSI over a
# checked-in manifest.
apiVersion: v1
kind: Secret
metadata:
  name: arp-secrets
  labels:
    app.kubernetes.io/name: arp-mcp
    app.kubernetes.io/part-of: agentic-retail-platform
type: Opaque
stringData:
  # AlloyDB / pgvector DSN.
  DATABASE_URL: "postgresql://arp:CHANGE_ME@alloydb-private-ip:5432/arp"
  # Memorystore endpoint.
  REDIS_URL: "redis://memorystore-private-ip:6379/0"
