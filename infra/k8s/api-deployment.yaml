# GKE deployment of the console API — the Kubernetes counterpart of the `api`
# Cloud Run service. Same image as the MCP server, a different command, and the
# same runtime identity (it needs the same Vertex and AlloyDB access, no more).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arp-api
  labels:
    app.kubernetes.io/name: arp-api
    app.kubernetes.io/component: console-api
    app.kubernetes.io/part-of: agentic-retail-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: arp-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arp-api
        app.kubernetes.io/component: console-api
        app.kubernetes.io/part-of: agentic-retail-platform
    spec:
      # Reuse the tool server's service account (bound to the GCP identity via
      # Workload Identity). The API and the MCP server need the same grants.
      serviceAccountName: arp-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace with the digest-pinned image pushed to Artifact Registry.
          image: europe-west1-docker.pkg.dev/your-gcp-project/arp/arp-mcp:latest
          imagePullPolicy: IfNotPresent
          # Override the image's default CMD (python -m arp.mcp).
          command: ["python", "-m", "arp.api"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # The API binds API_PORT; the shared ConfigMap's PORT drives the MCP.
            - name: API_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: arp-config
            - secretRef:
                name: arp-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Unlike the MCP server, the API answers GET /api/health, so an HTTP
          # probe is the honest readiness signal.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Root filesystem is read-only; give the process a writable scratch dir.
        - name: tmp
          emptyDir: {}
---
# ClusterIP: the API is unauthenticated, so it must never be exposed directly.
# Front it with an authenticated internal gateway if it has to leave the cluster.
apiVersion: v1
kind: Service
metadata:
  name: arp-api
  labels:
    app.kubernetes.io/name: arp-api
    app.kubernetes.io/component: console-api
    app.kubernetes.io/part-of: agentic-retail-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arp-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
