[project]
name = "agentic-retail-platform"
version = "0.1.0"
description = "Reusable agentic socle + demo agents for retail (POC)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "structlog>=24.1",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "pre-commit>=3.7"]

# Heavy runtime deps (LLM/vector/mcp) are installed in the `agents` extra so the
# base project stays fast to sync during early scaffolding. Enable with:
#   uv sync --extra agents
[project.optional-dependencies]
agents = [
  "langchain>=0.2",
  "langgraph>=0.2",
  "langchain-google-vertexai>=1.0",
  "mcp>=1.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "redis>=5.0",
  "fastapi>=0.115",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# iCloud resolves sync conflicts by dropping a "<name> 2.py" copy next to the
# original. Those stale copies are collectable test modules, so the suite
# silently reports a inflated count against outdated code. Never collect them.
addopts = ["--ignore-glob=* [0-9].py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arp"]
